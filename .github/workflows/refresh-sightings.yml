name: Refresh sightings

# Refresh of the committed iNaturalist community-sightings dataset every 6 hours.
# Re-runs the puller (same marine filters, plants capped low), commits the JSON if it
# changed, and the push triggers the Vercel production deploy. Manual runs available
# via the "Run workflow" button (workflow_dispatch).
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (00/06/12/18 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-sightings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull latest iNaturalist sightings (marine, low-plant)
        run: npx -y tsx sightings/pull-sightings.ts
      - name: Commit + push if the dataset changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sightings/sightings.real.json
          if git diff --cached --quiet; then
            echo "No change in sightings dataset."
          else
            git commit -m "chore: auto-refresh iNaturalist sightings"
            git push
          fi
