name: Sightings fetch tests

on:
  pull_request:
    paths:
      - "sightings/**"
      - ".github/workflows/refresh-sightings.yml"
      - ".github/workflows/sightings-tests.yml"
  push:
    branches: [main]
    paths:
      - "sightings/**"
      - ".github/workflows/refresh-sightings.yml"
      - ".github/workflows/sightings-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test sightings/fetch-observations.test.mjs
