specVersion: 1.0.0
description: Nautica — indexes Base sighting/quest events into leaderboard, per-player stats, and XP/leveling entities.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NauticaQuests
    # address + startBlock are also mirrored in networks.json (per-network).
    network: base-sepolia
    source:
      address: "0x70219d85cbb0d8d33934f9d77e4988ac2b231519"
      abi: NauticaQuests
      startBlock: 44611994
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Global
        - Player
        - Quest
        - Sighting
        - Attestation
        - Activity
        - SpeciesStat
      abis:
        - name: NauticaQuests
          file: ./abis/NauticaQuests.json
      eventHandlers:
        - event: QuestCreated(indexed bytes32,indexed address,string,string,uint32,uint256,uint256)
          handler: handleQuestCreated
        - event: QuestFunded(indexed bytes32,indexed address,uint256,uint256)
          handler: handleQuestFunded
        - event: SightingRecorded(indexed address,indexed bytes32,int64,int64,uint32,uint256,bytes32)
          handler: handleSightingRecorded
        - event: PayoutSettled(indexed address,indexed bytes32,uint256)
          handler: handlePayoutSettled
        - event: PlayerRegistered(indexed address,string)
          handler: handlePlayerRegistered
      file: ./src/mapping.ts
