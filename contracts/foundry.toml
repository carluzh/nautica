[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"

# To verify on Basescan after deploy:
#   forge verify-contract <addr> src/NauticaQuests.sol:NauticaQuests \
#     --chain 84532 --etherscan-api-key <BASESCAN_API_KEY> \
#     --constructor-args $(cast abi-encode "constructor(address,address,address)" <admin> <relayer> <usdc>)
